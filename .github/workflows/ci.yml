name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test gesture logic
        run: swift test
      - name: Check addon XML
        run: xmllint --noout Addon/TrackpadTurn/Bindings.xml
